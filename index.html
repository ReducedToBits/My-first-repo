<!DOCTYPE html>
<html lang="en">
    <head>
        <title>login | UNION Bank Account</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="logo-container">
            <svg class="logo" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <div class="logo-text-container">
                <p class="logo-text">UNION</p>
            </div>            
        </div>
        <div class="main-body">
            <div class="main-interface">
                <div class="login-head-container">
                    <p class="login-head">LOGIN</p>
                    <p class="login-head-description">Login to your <b>Union</b> account</p>
                    <p id="wrong-cred-popup" class="wrong-credential"></p>
                </div>
                <div class="input-fields">
                    <div class="input-fields-ID">
                        <p class="user-id-label">User ID</p>
                        <input id="id-user" class="User-ID" type="text">
                    </div>
                    <div class="input-fields-Pass">
                        <p class="password-label">Password</p>
                        <input id="user-password" class="Password" type="password">
                    </div>
                    <div class="forgot-password-container">
                        <p class="forgot-password">Forgot password ?
                            <a href="recovery-team.html" class="reset" target="_blank">Contact recovery team</a>
                        </p>
                    </div>
                </div>
                <div class="button-container">
                    <button id="login" class="login-button">Login</button>
                </div>           
            </div>
        </div>
        <audio src="components/rick-roll-hahahaha_PLz3HtW.mp3" id="prank-audio2" preload="auto" ></audio>             
    </body>
    <script src="index.js"></script>
    <script src="dashboard.js"></script>
</html>
